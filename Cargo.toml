[package]
name = "paranoid"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jwnx/paranoid"
description = "Build reproducible OCI images from Debian packages"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "color"] }
console = "0.15"
dirs = "5"
flate2 = { version = "1.1.8", features = ["zlib-rs"] }
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.24.0"
thiserror = "2"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.8"
url = { version = "2", features = ["serde"] }
xz2 = { version = "0.1.7", features = ["static"] }
tar = "0.4"
zstd = "0.13"
indexmap = { version = "2", features = ["serde"] }
pgp = { version = "0.20", default-features = false }
libc = "0.2"
md-5 = "0.10"

[dev-dependencies]
proptest = "1.6"
