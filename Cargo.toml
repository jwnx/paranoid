[package]
name = "paranoid"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "color"] }
console = "0.15"
dirs = "5"
flate2 = "1.1.8"
futures = "0.3"
hex = "0.4"
indicatif = { version = "0.17", features = ["tokio"] }
reqwest = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.24.0"
thiserror = "2"
tokio = { version = "1.49.0", features = ["full"] }
toml = "0.8"
url = { version = "2", features = ["serde"] }
xz2 = "0.1.7"
tar = "0.4"
zstd = "0.13"

[dev-dependencies]
proptest = "1.6"
