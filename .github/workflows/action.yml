# Run the action (action.yml) on each kind of runner it supports: install a
# release, build an example with it, and check its outputs.
#
# Actions are pinned by commit; versions are at least two weeks old when
# pinned.

name: action

on:
  push:
    branches: [main]
    paths: [action.yml, .github/workflows/action.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: paranoid
        uses: ./
        with:
          version: "0.7.1"
          lock: examples/hello-world/paranoid.lock
      - name: Build an example with it
        working-directory: examples/hello-world
        env:
          BIN: ${{ steps.paranoid.outputs.path }}
          CACHE_DIR: ${{ steps.paranoid.outputs.cache-dir }}
          VERSION: ${{ steps.paranoid.outputs.version }}
        run: |
          test "$VERSION" = 0.7.1
          test "$(command -v paranoid)" = "$BIN"
          paranoid build -o "$RUNNER_TEMP/hello-world.tar"
          test -n "$(ls -A "$CACHE_DIR")"
