paranoid = "~0.8"

[image]
name = "etcd"
architecture = "arm64"

[repositories.debian]
url = "https://deb.debian.org/debian"
distribution = "bookworm"
components = ["main"]
signed_by = "../keys/debian-archive-bookworm-automatic.asc"

[[packages]]
name = "etcd-server"

[[packages]]
name = "etcd-client"

[entrypoint]
cmd = ["etcdctl"]
